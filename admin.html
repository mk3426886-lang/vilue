<!-- admin.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير - متجر ليون</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* إضافات خاصة بلوحة الإدارة */
        .admin-wrapper {
            display: flex;
            min-height: 100vh;
            background: #f0f2f5;
        }
        .admin-sidebar {
            width: 280px;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 25px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        .admin-logo {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }
        .admin-logo img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
        .admin-logo h3 {
            color: #ff6a00;
            margin: 5px 0;
        }
        .admin-menu {
            list-style: none;
            padding: 0;
        }
        .admin-menu li {
            padding: 12px 25px;
            cursor: pointer;
            transition: 0.2s;
            border-right: 3px solid transparent;
        }
        .admin-menu li:hover, .admin-menu li.active {
            background: rgba(255,106,0,0.2);
            border-right-color: #ff6a00;
        }
        .admin-menu li i {
            width: 30px;
            margin-left: 10px;
        }
        .admin-content {
            flex: 1;
            margin-right: 280px;
            padding: 25px;
        }
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .stat-card i {
            font-size: 40px;
            color: #ff6a00;
        }
        .section-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .section-title {
            color: #ff6a00;
            border-right: 4px solid #ff6a00;
            padding-right: 15px;
            margin-bottom: 20px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .admin-input, .admin-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
        }
        .admin-btn {
            background: #ff6a00;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .admin-btn-danger {
            background: #dc3545;
        }
        .admin-btn-success {
            background: #28a745;
        }
        .products-table {
            width: 100%;
            overflow-x: auto;
        }
        .products-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .products-table th, .products-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }
        .product-img-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 10px;
        }
        .edit-btn, .delete-btn {
            padding: 6px 12px;
            margin: 0 3px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .edit-btn { background: #ffc107; color: #333; }
        .delete-btn { background: #dc3545; color: white; }
        .coupon-item-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .image-preview {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            margin-top: 10px;
        }
        @media (max-width: 768px) {
            .admin-sidebar { width: 70px; }
            .admin-sidebar span { display: none; }
            .admin-content { margin-right: 70px; }
            .admin-menu li i { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div id="adminContainer"></div>
    <script src="admin.js"></script>
</body>
</html>
