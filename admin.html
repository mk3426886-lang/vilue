<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - ماركت ليون</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .admin-wrap {
            max-width: 1300px;
            margin: 25px auto;
            padding: 0 20px;
        }
        .admin-header {
            background: linear-gradient(115deg, #ff6a00, #ff9430);
            color: white;
            padding: 28px;
            border-radius: 48px;
            margin-bottom: 30px;
            text-align: center;
        }
        .admin-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: white;
            padding: 12px 20px;
            border-radius: 80px;
            margin-bottom: 30px;
        }
        .admin-tab {
            padding: 10px 26px;
            border-radius: 50px;
            cursor: pointer;
            background: #f0f2f5;
            font-weight: 600;
            transition: 0.2s;
        }
        .admin-tab.active, .admin-tab:hover {
            background: #ff6a00;
            color: white;
        }
        .admin-card {
            background: white;
            border-radius: 38px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.03);
        }
        .admin-card h3 {
            color: #ff6a00;
            border-right: 5px solid #ff6a00;
            padding-right: 18px;
            margin-bottom: 22px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 20px;
        }
        .admin-input, .admin-select {
            width: 100%;
            padding: 14px;
            border-radius: 28px;
            border: 1px solid #e2e8f0;
            font-family: 'Tajawal', sans-serif;
        }
        .admin-btn {
            background: #ff6a00;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }
        .admin-btn-danger {
            background: #dc3545;
        }
        table {
            width: 100%;
            overflow-x: auto;
            display: block;
        }
        th, td {
            padding: 12px 8px;
            text-align: right;
            border-bottom: 1px solid #edf2f7;
        }
        .mini-img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 16px;
        }
        .login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .login-card {
            background: white;
            border-radius: 48px;
            padding: 38px 28px;
            text-align: center;
            width: 340px;
        }
        .login-card input {
            width: 100%;
            padding: 14px;
            margin: 18px 0;
            border-radius: 50px;
            border: 1px solid #ddd;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="adminRoot"></div>
    <script src="admin.js"></script>
</body>
</html>
