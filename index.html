<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ماركت ليون | MARKET LION</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <div class="bg-gradient"></div>

    <header class="header">
        <div class="header-top">
            <div class="logo-box">
                <div class="logo-icon" id="logoContainer">
                    <img id="storeLogo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23ff6a00'/%3E%3Ctext x='50' y='68' text-anchor='middle' fill='white' font-size='45' font-weight='bold'%3E🦁%3C/text%3E%3C/svg%3E" alt="شعار">
                </div>
                <div class="logo-text">
                    <h1>ماركت ليون</h1>
                    <span>MARKET LION</span>
                </div>
            </div>
            <div class="header-buttons">
                <button class="icon-btn" id="ordersHistoryBtn">
                    <i class="fas fa-clock"></i>
                    <span>طلباتي</span>
                </button>
                <button class="cart-btn" id="cartToggleBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cartCount">0</span>
                </button>
            </div>
        </div>
        <div class="social-row">
            <a href="#" class="social-link"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-link"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-link"><i class="fab fa-facebook-messenger"></i></a>
            <a href="#" class="social-link"><i class="fab fa-telegram"></i></a>
            <a href="#" class="social-link"><i class="fab fa-tiktok"></i></a>
            <button id="shareBtn" class="share-link"><i class="fas fa-share-alt"></i> مشاركة</button>
        </div>
    </header>

    <div id="cartSidebar" class="cart-sidebar hidden">
        <div class="cart-head">
            <h3><i class="fas fa-bag-shopping"></i> سلة المشتريات</h3>
            <button id="closeCartBtn"><i class="fas fa-times"></i></button>
        </div>
        <div id="cartItemsList" class="cart-items"></div>
        <div class="cart-coupon-area">
            <input type="text" id="couponCodeInput" placeholder="🎟️ كود الخصم">
            <button id="applyCouponBtn">تطبيق</button>
        </div>
        <div class="cart-total-box">
            <div class="total-row">المجموع: <span id="cartTotal">0</span> د.ع</div>
            <div class="total-row">الخصم: -<span id="cartDiscount">0</span> د.ع</div>
            <div class="total-row">التوصيل: +<span id="deliveryFee">0</span> د.ع</div>
            <div class="total-row grand">الإجمالي: <span id="cartGrandTotal">0</span> د.ع</div>
        </div>
        <button id="checkoutBtn" class="cart-checkout">إتمام الطلب 📝</button>
    </div>

    <div class="swiper-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="sliderWrapper"></div>
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <div class="quick-cats" id="quickCats"></div>

    <div class="products-container" id="productsGrid"></div>

    <div id="productModal" class="modal">
        <div class="modal-box product-box">
            <span class="modal-close">&times;</span>
            <div id="productDetail"></div>
            <button id="modalAddBtn" class="modal-add">➕ أضف للسلة</button>
        </div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-box">
            <span class="modal-close">&times;</span>
            <h2><i class="fas fa-user-edit"></i> معلومات الطلب</h2>
            <form id="orderForm">
                <input type="text" id="orderName" placeholder="الاسم الكامل" required>
                <input type="tel" id="orderPhone" placeholder="رقم الهاتف" required>
                <select id="orderGov" required>
                    <option value="">-- اختر المحافظة --</option>
                    <option value="بغداد">بغداد</option><option value="النجف">النجف</option><option value="البصرة">البصرة</option>
                    <option value="اربيل">اربيل</option><option value="دهوك">دهوك</option><option value="السليمانية">السليمانية</option>
                    <option value="كركوك">كركوك</option><option value="نينوى">نينوى</option><option value="بابل">بابل</option>
                    <option value="كربلاء">كربلاء</option><option value="واسط">واسط</option><option value="ذي قار">ذي قار</option>
                    <option value="ميسان">ميسان</option><option value="المثنى">المثنى</option><option value="القادسية">القادسية</option>
                    <option value="ديالى">ديالى</option><option value="صلاح الدين">صلاح الدين</option><option value="الانبار">الأنبار</option>
                </select>
                <input type="text" id="orderDistrict" placeholder="المنطقة (كتابة حرة)" required>
                <input type="text" id="orderNear" placeholder="أقرب نقطة دالة" required>
                <button type="submit">✅ تأكيد الطلب وإرسال للواتساب</button>
            </form>
        </div>
    </div>

    <div id="invoiceModal" class="modal">
        <div class="modal-box invoice-box">
            <span class="modal-close close-invoice">&times;</span>
            <h2><i class="fas fa-receipt"></i> فاتورة الطلب</h2>
            <div id="invoiceContent"></div>
            <button id="sendWhatsappBtn" class="whatsapp-submit">📲 إرسال عبر واتساب</button>
        </div>
    </div>

    <div id="ordersModal" class="modal">
        <div class="modal-box orders-box">
            <span class="modal-close close-orders">&times;</span>
            <h2><i class="fas fa-history"></i> طلباتي السابقة</h2>
            <div id="ordersList"></div>
        </div>
    </div>

    <div id="toastMsg" class="toast-messages"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
                  </html>
