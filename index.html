<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>متجر إلكترونيات متكامل | مع تحقق واتساب ولوحة أدمن</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tajawal', sans-serif;
        }
        body {
            background: #f0f2f5;
        }
        /* Header */
        .header {
            background: linear-gradient(135deg, #0a2b3e, #0f3b4f);
            color: white;
            padding: 0.8rem 2rem;
            position: sticky;
            top: 0;
            z-index: 99;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo h2 { font-size: 1.5rem; }
        .logo p { font-size: 0.7rem; opacity: 0.8; }
        .cart-icon, .admin-icon {
            background: #ff9800;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 5px;
        }
        .admin-icon { background: #2c3e66; }
        /* Categories */
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 20px;
        }
        .cat-btn {
            background: white;
            border: none;
            padding: 8px 25px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            transition: 0.2s;
        }
        .cat-btn.active { background: #0f3b4f; color: white; }
        /* Products */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1400px;
            margin: auto;
        }
        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .product-card:hover { transform: translateY(-5px); }
        .product-img {
            background: #eef2f7;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }
        .product-info { padding: 1rem; }
        .product-title { font-weight: bold; margin: 5px 0; }
        .product-price { color: #e67e22; font-weight: bold; margin: 5px 0; font-size: 1.2rem; }
        .stock-badge { font-size: 0.7rem; color: green; }
        .outstock { color: red; }
        .add-btn {
            background: #0f3b4f;
            color: white;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 8px;
        }
        .add-btn.disabled { background: gray; cursor: not-allowed; }
        /* Cart Drawer */
        .cart-overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5);
            visibility: hidden;
            z-index: 200;
        }
        .cart-drawer {
            position: fixed;
            left:0; top:0; width: 90%; max-width: 400px;
            background: white; height: 100%;
            padding: 1rem;
            transform: translateX(-100%);
            transition: 0.3s;
            z-index: 201;
            display: flex;
            flex-direction: column;
        }
        .cart-drawer.open { transform: translateX(0); }
        /* Admin Panel Modal */
        .modal {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.7);
            z-index: 300;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            padding: 1.5rem;
            max-height: 85%;
            overflow-y: auto;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 12px;
            border: 1px solid #ccc;
        }
        button { cursor: pointer; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #2e7d32;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 400;
            opacity: 0;
            transition: 0.2s;
        }
        .verify-section { background: #f9f9f9; padding: 10px; border-radius: 15px; margin: 10px 0; }
        .flex-btns { display: flex; gap: 10px; }
        @media (max-width:600px) { .header { flex-direction: column; gap: 10px; } }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">
        <h2>🛒 EliteElectro Pro</h2>
        <p>ماوسات • كيبوردات • ماوس باد • اكسسوارات</p>
    </div>
    <div>
        <div class="admin-icon" id="adminPanelBtn">👑 لوحة الأدمن</div>
        <div class="cart-icon" id="cartIconBtn">🛒 السلة (<span id="cartCount">0</span>)</div>
    </div>
</div>

<div class="categories" id="categoriesContainer"></div>
<div class="products-grid" id="productsGrid"></div>

<!-- سلة الشراء -->
<div class="cart-overlay" id="cartOverlay"></div>
<div class="cart-drawer" id="cartDrawer">
    <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding-bottom: 10px;">
        <h3>سلة المشتريات</h3>
        <button id="closeCartBtn" style="background:#ccc; border:none; padding:5px 12px; border-radius:30px;">✖</button>
    </div>
    <div id="cartItemsList" style="flex:1; overflow:auto; margin: 15px 0;"></div>
    <div id="cartTotal" style="font-weight: bold; font-size: 1.2rem; margin: 10px 0;">المجموع: 0 ريال</div>
    <button id="checkoutBtn" class="order-btn" style="background:#2e7d32; color:white; width:100%; padding:12px; border:none; border-radius:40px;">📦 إتمام الطلب</button>
</div>

<!-- Modal التحقق + إدخال بيانات -->
<div id="verifyModal" class="modal">
    <div class="modal-content">
        <h3>✅ تأكيد الطلب والتحقق</h3>
        <div id="orderPreview" style="background:#eee; padding:10px; border-radius:12px; margin:10px 0;"></div>
        <input type="text" id="fullName" placeholder="الاسم الكامل *" required>
        <input type="text" id="city" placeholder="المحافظة *">
        <input type="text" id="address" placeholder="العنوان التفصيلي *">
        <input type="tel" id="phoneNumber" placeholder="رقم الجوال (واتساب) *" required>
        <input type="email" id="email" placeholder="البريد الإلكتروني (اختياري)">
        
        <!-- Captcha بسيط anti-robot -->
        <div class="verify-section">
            <label>🔒 تحقق: كم حاصل 5 + 3؟</label>
            <input type="number" id="captchaAnswer" placeholder="أدخل الناتج">
        </div>

        <button id="sendCodeBtn" style="background:#25D366; color:white; width:100%; padding:10px;">📲 إرسال كود التحقق عبر واتساب</button>
        
        <div id="codeVerificationSection" style="display:none; margin-top:15px;">
            <input type="text" id="verificationCode" placeholder="أدخل الكود المرسل">
            <button id="verifyCodeBtn" style="background:#0f3b4f; color:white;">✅ تحقق وأكمل الطلب</button>
        </div>
        <p style="font-size:12px; color:gray; margin-top:10px;">سيتم إرسال كود مكون من 6 أرقام إلى رقم واتساب الخاص بك.</p>
        <button id="closeModalBtn" style="background:#ccc; margin-top:10px;">إلغاء</button>
    </div>
</div>

<!-- لوحة تحكم الأدمن (إدارة المنتجات والكميات) -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <h3>🔐 دخول الأدمن</h3>
        <input type="password" id="adminPass" placeholder="كلمة سر الأدمن">
        <button id="adminLoginBtn">دخول</button>
        <hr>
        <div id="adminControls" style="display:none;">
            <h4>➕ إضافة منتج جديد</h4>
            <input type="text" id="prodName" placeholder="اسم المنتج">
            <input type="number" id="prodPrice" placeholder="السعر">
            <input type="text" id="prodCategory" placeholder="القسم (ماوسات/كيبوردات/ماوس باد/سماعات)">
            <input type="number" id="prodStock" placeholder="الكمية المتاحة">
            <input type="text" id="prodIcon" placeholder="أيقونة (رمز تعبيري مثلاً 🖱️)">
            <button id="addProductBtn">➕ إضافة</button>
            <hr>
            <h4>📦 تعديل الكمية / حذف</h4>
            <select id="productSelect"></select>
            <input type="number" id="updateStock" placeholder="تحديث الكمية">
            <button id="updateStockBtn">تحديث الكمية</button>
            <button id="deleteProductBtn" style="background:#c0392b;">حذف المنتج</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
    // ---------- قاعدة بيانات المنتجات (مع stock) ----------
    let products = [
        { id: 1, name: "ماوس ريزر فيبر ميني", category: "ماوسات", price: 180, stock: 12, icon: "🖱️" },
        { id: 2, name: "كيبورد لوجيتك G915", category: "كيبوردات", price: 450, stock: 5, icon: "⌨️" },
        { id: 3, name: "ماوس باد ستيل سيريس XL", category: "ماوس باد", price: 85, stock: 20, icon: "🧩" },
        { id: 4, name: "سماعة هايبر اكس كلاود 2", category: "سماعات", price: 320, stock: 8, icon: "🎧" },
        { id: 5, name: "شاحن لاسلكي سريع", category: "شواحن", price: 65, stock: 15, icon: "⚡" },
        { id: 6, name: "حامل سماعة RGB", category: "اكسسوارات", price: 110, stock: 7, icon: "🎙️" },
        { id: 7, name: "كيبورد ميكانيكي دامو", category: "كيبوردات", price: 199, stock: 0, icon: "⌨️" }, // out of stock
        { id: 8, name: "ماوس لوجيتك G502", category: "ماوسات", price: 250, stock: 3, icon: "🖱️" }
    ];
    
    let cart = []; // { id, name, price, quantity, stockRef }
    let activeCategory = "الكل";
    let pendingOrderData = null;   // لحفظ بيانات السلة قبل التحقق
    let generatedCode = "";
    let verifiedPhone = false;
    let tempPhone = "";
    
    // كلمة سر الأدمن
    const ADMIN_PASSWORD = "admin123";
    
    // Helper functions
    function saveCart() { localStorage.setItem("advancedCart", JSON.stringify(cart)); }
    function loadCart() { let saved = localStorage.getItem("advancedCart"); if(saved) cart = JSON.parse(saved); updateCartUI(); }
    
    function showToast(msg, isError = false) {
        let toast = document.getElementById("toastMsg");
        toast.style.backgroundColor = isError ? "#c0392b" : "#2e7d32";
        toast.innerText = msg;
        toast.style.opacity = "1";
        setTimeout(() => toast.style.opacity = "0", 2500);
    }
    
    function updateCartUI() {
        let count = cart.reduce((sum, i) => sum + i.quantity, 0);
        document.getElementById("cartCount").innerText = count;
        let container = document.getElementById("cartItemsList");
        let total = 0;
        if(cart.length === 0) {
            container.innerHTML = "<p style='text-align:center'>🛒 السلة فارغة</p>";
            document.getElementById("cartTotal").innerHTML = "المجموع: 0 ريال";
            return;
        }
        let html = "";
        cart.forEach((item, idx) => {
            let itemTotal = item.price * item.quantity;
            total += itemTotal;
            html += `<div style="display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding:8px 0;">
                        <div><b>${item.name}</b><br>${item.price} ريال × ${item.quantity}</div>
                        <div><button class="removeCartItem" data-id="${item.id}" style="background:#e67e22; border:none; color:white; border-radius:20px; padding:4px 8px;">حذف</button></div>
                     </div>`;
        });
        container.innerHTML = html;
        document.getElementById("cartTotal").innerHTML = `المجموع: ${total.toFixed(2)} ريال`;
        document.querySelectorAll(".removeCartItem").forEach(btn => {
            btn.addEventListener("click", (e) => {
                let id = parseInt(btn.getAttribute("data-id"));
                cart = cart.filter(i => i.id !== id);
                saveCart();
                updateCartUI();
                showToast("تم إزالة المنتج");
            });
        });
    }
    
    function addToCart(product) {
        if(product.stock <= 0) { showToast("❌ نفذت الكمية!", true); return false; }
        let existing = cart.find(i => i.id === product.id);
        if(existing) {
            if(existing.quantity + 1 > product.stock) { showToast(`الكمية المتاحة فقط ${product.stock}`, true); return false; }
            existing.quantity++;
        } else {
            if(1 > product.stock) return false;
            cart.push({ id: product.id, name: product.name, price: product.price, quantity: 1 });
        }
        saveCart();
        updateCartUI();
        showToast(`✅ تم إضافة ${product.name}`);
        return true;
    }
    
    function renderProducts() {
        let filtered = activeCategory === "الكل" ? products : products.filter(p => p.category === activeCategory);
        let grid = document.getElementById("productsGrid");
        if(filtered.length === 0) { grid.innerHTML = "<div>لا توجد منتجات</div>"; return; }
        let html = "";
        filtered.forEach(p => {
            let stockText = p.stock > 0 ? `📦 متبقي: ${p.stock}` : "❌ غير متوفر";
            let btnDisabled = p.stock <= 0 ? "disabled" : "";
            html += `<div class="product-card">
                        <div class="product-img">${p.icon}</div>
                        <div class="product-info">
                            <div class="product-title">${p.name}</div>
                            <div class="product-price">💰 ${p.price} ريال</div>
                            <div class="stock-badge ${p.stock <=0 ? 'outstock' : ''}">${stockText}</div>
                            <button class="add-btn ${btnDisabled}" data-id="${p.id}" ${btnDisabled}>➕ أضف للسلة</button>
                        </div>
                    </div>`;
        });
        grid.innerHTML = html;
        document.querySelectorAll(".add-btn").forEach(btn => {
            if(btn.hasAttribute("disabled")) return;
            btn.addEventListener("click", (e) => {
                let id = parseInt(btn.getAttribute("data-id"));
                let product = products.find(p => p.id === id);
                if(product) addToCart(product);
            });
        });
    }
    
    function renderCategories() {
        let cats = ["الكل", ...new Set(products.map(p => p.category))];
        let container = document.getElementById("categoriesContainer");
        container.innerHTML = cats.map(cat => `<button class="cat-btn ${activeCategory===cat ? 'active' : ''}" data-cat="${cat}">${cat}</button>`).join('');
        document.querySelectorAll(".cat-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                activeCategory = btn.getAttribute("data-cat");
                renderCategories();
                renderProducts();
            });
        });
    }
    
    // إرسال كود واتساب عبر رابط wa.me (محاكاة مباشرة ولكن سيفتح واتساب بالكود)
    function sendWhatsAppCode(phone, code) {
        // تنظيف الرقم
        let cleanPhone = phone.replace(/[^0-9+]/g, '');
        if(!cleanPhone.startsWith('+')) cleanPhone = '+966' + cleanPhone.replace(/^0+/, '');
        let message = `🔐 *كود التحقق من متجر EliteElectro* : ${code}\nأدخل هذا الكود لإتمام عملية الشراء.`;
        let whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');
        showToast("تم فتح محادثة واتساب لإرسال الكود، الرجاء إرسالها ثم العودة وإدخال الكود");
    }
    
    // توليد كود عشوائي 6 أرقام
    function generateRandomCode() { return Math.floor(100000 + Math.random() * 900000).toString(); }
    
    // فتح نافذة التحقق عند الضغط على إتمام الطلب
    function openCheckout() {
        if(cart.length === 0) { showToast("السلة فارغة!", true); return; }
        let totalPrice = cart.reduce((sum,i) => sum + (i.price * i.quantity),0);
        let previewHtml = `<b>المنتجات:</b><br>${cart.map(i=>`${i.name} x${i.quantity}`).join('<br>')}<br><b>الإجمالي: ${totalPrice} ريال</b>`;
        document.getElementById("orderPreview").innerHTML = previewHtml;
        document.getElementById("verifyModal").style.display = "flex";
        document.getElementById("codeVerificationSection").style.display = "none";
        generatedCode = "";
        verifiedPhone = false;
        // مسح الحقول
        document.getElementById("fullName").value = "";
        document.getElementById("city").value = "";
        document.getElementById("address").value = "";
        document.getElementById("phoneNumber").value = "";
        document.getElementById("email").value = "";
        document.getElementById("captchaAnswer").value = "";
        document.getElementById("verificationCode").value = "";
    }
    
    // إرسال كود التحقق (يتحقق من الكابتشا والرقم)
    document.getElementById("sendCodeBtn")?.addEventListener("click", () => {
        let captcha = document.getElementById("captchaAnswer").value;
        if(parseInt(captcha) !== 8) { showToast("❌ فشل التحقق من أنك لست روبوت", true); return; }
        let phone = document.getElementById("phoneNumber").value.trim();
        if(!phone) { showToast("أدخل رقم الجوال", true); return; }
        let name = document.getElementById("fullName").value.trim();
        if(!name) { showToast("أدخل الاسم الكامل", true); return; }
        let city = document.getElementById("city").value.trim();
        let address = document.getElementById("address").value.trim();
        if(!city || !address) { showToast("يرجى إدخال المحافظة والعنوان", true); return; }
        tempPhone = phone;
        generatedCode = generateRandomCode();
        // إرسال عبر واتساب باستخدام الرابط
        sendWhatsAppCode(phone, generatedCode);
        document.getElementById("codeVerificationSection").style.display = "block";
        showToast("تم إرسال الكود، افتح واتساب وأرسل الرسالة ثم ادخل الكود أدناه");
    });
    
    // التحقق من الكود وإرسال الطلب النهائي عبر واتساب للأدمن
    document.getElementById("verifyCodeBtn")?.addEventListener("click", () => {
        let userCode = document.getElementById("verificationCode").value;
        if(userCode !== generatedCode) { showToast("الكود غير صحيح! حاول مرة أخرى", true); return; }
        if(!tempPhone) { showToast("رقم الجوال مفقود", true); return; }
        // تجهيز رسالة الطلب
        let name = document.getElementById("fullName").value;
        let city = document.getElementById("city").value;
        let address = document.getElementById("address").value;
        let email = document.getElementById("email").value;
        let totalPrice = cart.reduce((sum,i) => sum + (i.price * i.quantity),0);
        let itemsText = cart.map(i => `• ${i.name} (x${i.quantity}) = ${i.price*i.quantity} ريال`).join("%0A");
        let finalMsg = `🛍️ *طلب جديد من المتجر* %0A👤 الاسم: ${name}%0A📍 المحافظة: ${city}%0A🏠 العنوان: ${address}%0A📞 الجوال: ${tempPhone}%0A📧 البريد: ${email || "لا يوجد"}%0A📦 *المنتجات:* %0A${itemsText}%0A💰 *الإجمالي: ${totalPrice} ريال*%0A✅ تم التحقق عبر واتساب`;
        // إرسال الطلب لرقم الأدمن (يمكن تغيير الرقم)
        let adminPhone = "+9665XXXXXXXX";  // ضع رقم الأدمن الحقيقي هنا
        let adminWhatsapp = `https://wa.me/${adminPhone}?text=${finalMsg}`;
        window.open(adminWhatsapp, '_blank');
        // خصم الكميات من المخزون
        cart.forEach(cartItem => {
            let product = products.find(p => p.id === cartItem.id);
            if(product) product.stock = Math.max(0, product.stock - cartItem.quantity);
        });
        cart = [];
        saveCart();
        updateCartUI();
        renderProducts();
        showToast("✅ تم إرسال الطلب للأدمن عبر واتساب! شكراً لتسوقك");
        document.getElementById("verifyModal").style.display = "none";
        generatedCode = "";
    });
    
    // ----- لوحة الأدمن (إدارة المنتجات والكميات) -----
    function refreshAdminSelect() {
        let select = document.getElementById("productSelect");
        if(select) select.innerHTML = products.map(p => `<option value="${p.id}">${p.name} (الكمية: ${p.stock})</option>`).join('');
    }
    
    document.getElementById("adminPanelBtn")?.addEventListener("click", () => {
        document.getElementById("adminModal").style.display = "flex";
        document.getElementById("adminControls").style.display = "none";
        document.getElementById("adminPass").value = "";
    });
    document.getElementById("adminLoginBtn")?.addEventListener("click", () => {
        let pass = document.getElementById("adminPass").value;
        if(pass === ADMIN_PASSWORD) {
            document.getElementById("adminControls").style.display = "block";
            refreshAdminSelect();
        } else { alert("كلمة سر خاطئة"); }
    });
    // إضافة منتج
    document.getElementById("addProductBtn")?.addEventListener("click", () => {
        let name = document.getElementById("prodName").value;
        let price = parseFloat(document.getElementById("prodPrice").value);
        let category = document.getElementById("prodCategory").value;
        let stock = parseInt(document.getElementById("prodStock").value);
        let icon = document.getElementById("prodIcon").value || "📦";
        if(!name || isNaN(price)) { alert("بيانات ناقصة"); return; }
        let newId = Date.now();
        products.push({ id: newId, name, category, price, stock, icon });
        renderProducts(); renderCategories(); refreshAdminSelect();
        showToast("تمت إضافة المنتج");
        document.getElementById("prodName").value = "";
    });
    // تحديث الكمية
    document.getElementById("updateStockBtn")?.addEventListener("click", () => {
        let id = parseInt(document.getElementById("productSelect").value);
        let newStock = parseInt(document.getElementById("updateStock").value);
        let product = products.find(p => p.id === id);
        if(product && !isNaN(newStock)) { product.stock = newStock; renderProducts(); refreshAdminSelect(); showToast("تم تحديث الكمية"); }
    });
    // حذف منتج
    document.getElementById("deleteProductBtn")?.addEventListener("click", () => {
        let id = parseInt(document.getElementById("productSelect").value);
        products = products.filter(p => p.id !== id);
        renderProducts(); renderCategories(); refreshAdminSelect(); showToast("تم الحذف");
    });
    
    // Event listeners للسلة
    document.getElementById("cartIconBtn")?.addEventListener("click", () => { document.getElementById("cartDrawer").classList.add("open"); document.getElementById("cartOverlay").classList.add("open"); });
    document.getElementById("closeCartBtn")?.addEventListener("click", () => { document.getElementById("cartDrawer").classList.remove("open"); document.getElementById("cartOverlay").classList.remove("open"); });
    document.getElementById("cartOverlay")?.addEventListener("click", () => { document.getElementById("cartDrawer").classList.remove("open"); document.getElementById("cartOverlay").classList.remove("open"); });
    document.getElementById("checkoutBtn")?.addEventListener("click", () => { document.getElementById("cartDrawer").classList.remove("open"); document.getElementById("cartOverlay").classList.remove("open"); openCheckout(); });
    document.getElementById("closeModalBtn")?.addEventListener("click", () => { document.getElementById("verifyModal").style.display = "none"; });
    document.querySelectorAll(".modal .modal-content #closeModalBtn").forEach(btn => {});
    
    // تحميل أولي
    loadCart();
    renderCategories();
    renderProducts();
</script>
</body>
</html>
