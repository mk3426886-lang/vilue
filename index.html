<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر ليون | STORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="logo-section">
                <img src="logo.png" alt="شعار متجر ليون" class="store-logo" onerror="this.src='https://placehold.co/65x65/fff/333?text=LION'">
                <div class="brand-info">
                    <h1>متجر ليون | STORE</h1>
                    <a href="https://www.tiktok.com/@lione_market" target="_blank" class="tiktok-link">
                        <svg class="tiktok-icon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.03 1.6 4.19 1.11 1.25 2.69 1.94 4.35 2.15v3.62c-1.33-.14-2.6-.63-3.66-1.48v6.78c.02 1.69-.47 3.39-1.43 4.73-1.44 1.99-3.9 3.07-6.33 2.82-2.58-.2-4.83-1.92-5.61-4.4-1.01-3.05.61-6.52 3.65-7.55.57-.19 1.17-.29 1.77-.29v3.66c-1-.01-1.99.5-2.51 1.37-.62.97-.54 2.31.22 3.19.83.93 2.21 1.15 3.26.51.71-.41 1.13-1.17 1.14-2V0h2.88z"/></svg>
                        lione_market
                    </a>
                </div>
            </div>
            <nav class="nav-links">
                <a href="#" class="active">الرئيسية</a>
            </nav>
        </div>
    </header>

    <main class="store-layout">
        
        <section class="products-section">
            <h2 class="section-title">الأجهزة والإكسسوارات الذكية</h2>
            <div class="products-grid" id="productsContainer">
                </div>
        </section>

        <aside class="sidebar">
            <div class="cart-card">
                <h3>سلة المنتجات</h3>
                <div class="cart-items" id="cartItems">
                    <p class="empty-cart-msg">السلة فارغة حالياً.</p>
                </div>
                
                <div class="coupon-section">
                    <input type="text" id="couponInput" placeholder="أدخل كود الخصم">
                    <button onclick="applyCoupon()">تطبيق</button>
                </div>

                <div class="cart-summary">
                    <div class="summary-row">
                        <span>المجموع:</span>
                        <span id="cartSubtotal">0 م.ي</span>
                    </div>
                    <div class="summary-row discount-row" id="discountRow" style="display: none;">
                        <span>الخصم:</span>
                        <span id="cartDiscount">0 م.ي</span>
                    </div>
                    <div class="summary-row total-row">
                        <span>إجمالي الطلب:</span>
                        <span id="cartTotal">0 م.ي</span>
                    </div>
                </div>

                <button class="checkout-btn" onclick="openCheckoutModal()">إكمال الطلب</button>
            </div>
        </aside>
    </main>

    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeCheckoutModal()">&times;</button>
            <h3>معلومات العميل</h3>
            <form id="checkoutForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="clientName">الاسم الكامل:</label>
                    <input type="text" id="clientName" required placeholder="أدخل اسمك الثلاثي">
                </div>
                <div class="form-group">
                    <label for="clientAddress">العنوان بالتفصيل:</label>
                    <input type="text" id="clientAddress" required placeholder="المحافظة / المنطقة / نقطة دالة">
                </div>
                <div class="form-group">
                    <label for="clientPhone">رقم الهاتف:</label>
                    <input type="tel" id="clientPhone" required placeholder="077XXXXXXXX">
                </div>
                <button type="submit" class="submit-order-btn">إكمال الطلب وتوليد الكود</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="receiptModal">
        <div class="modal-content receipt-content">
            <h3>تأكيد الطلب</h3>
            <p class="receipt-intro">تم توليد كود الطلب بنجاح! يرجى إرساله للمدير لتأكيد الحجز.</p>
            
            <div class="receipt-box">
                <div class="receipt-header">
                    <h4>طلب جديد</h4>
                    <p>كود الطلب الفريد: <strong id="orderIdDisplay">#LION-00000</strong></p>
                </div>
                <hr>
                <div id="receiptDetails">
                    </div>
            </div>

            <button class="whatsapp-send-btn" onclick="sendToWhatsApp()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.513 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.503-5.714-1.458L0 24zm6.59-3.531c1.651.98 3.468 1.498 5.321 1.5 5.561 0 10.086-4.523 10.089-10.08a9.96 9.96 0 0 0-2.957-7.128 9.947 9.947 0 0 0-7.136-2.955C6.26 1.806 1.734 6.33 1.732 11.887c-.001 1.932.504 3.816 1.464 5.483l-.993 3.626 3.715-.975z"/></svg>
                إرسال الطلب عبر الواتساب للمدير
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
