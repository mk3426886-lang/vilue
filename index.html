<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر ليون | MARKET LION STORE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- شعار دائري -->
    <header class="main-header">
        <div class="logo-circle">
            <div class="logo-inner">
                <span class="logo-l">L</span>
                <div class="logo-flowers">🌸</div>
            </div>
            <h1>MARKET LION</h1>
            <p>STORE</p>
        </div>
        <a href="https://tiktok.com/@lione_market" target="_blank" class="tiktok-link">
            <i class="fab fa-tiktok"></i> @lione_market
        </a>
    </header>

    <!-- شريط التنقل -->
    <nav class="top-nav">
        <div class="nav-container">
            <button class="nav-btn active" onclick="filterProducts('all')">الكل</button>
            <div id="categories-nav"></div>
            <button class="cart-toggle" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </button>
            <button class="orders-btn" onclick="showMyOrders()">
                <i class="fas fa-box"></i> طلباتي
            </button>
        </div>
    </nav>

    <!-- سلايدر -->
    <div class="slider-container" id="sliderContainer">
        <div class="slider" id="slider"></div>
    </div>

    <!-- شبكة المنتجات -->
    <main class="products-grid" id="productsGrid"></main>

    <!-- سلة المشتريات -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>🛒 سلة المنتجات</h3>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="discount-section">
                <input type="text" id="discountCode" placeholder="أدخل كود الخصم">
                <button onclick="applyDiscount()">تطبيق</button>
            </div>
            <div class="cart-summary">
                <div class="summary-row"><span>المجموع:</span> <span id="subtotal">0 د.ع</span></div>
                <div class="summary-row"><span>الخصم:</span> <span id="discountAmount">0 د.ع</span></div>
                <div class="summary-row"><span>التوصيل:</span> <span id="deliveryFee">0 د.ع</span></div>
                <div class="summary-row total"><span>الإجمالي:</span> <span id="totalPrice">0 د.ع</span></div>
            </div>
            <button class="checkout-btn" onclick="showCheckout()">إتمام الطلب</button>
        </div>
    </div>

    <!-- مودال إتمام الطلب -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal">
            <h3>🧾 تأكيد الطلب</h3>
            <input type="text" id="customerName" placeholder="الاسم الكامل">
            <input type="text" id="customerPhone" placeholder="رقم الهاتف">
            <input type="text" id="customerAddress" placeholder="العنوان التفصيلي">
            <input type="text" id="customerRegion" placeholder="المنطقة">
            <div class="invoice-preview" id="invoicePreview"></div>
            <button class="confirm-btn" onclick="confirmOrder()">
                <i class="fab fa-whatsapp"></i> إرسال عبر الواتساب
            </button>
            <button class="cancel-btn" onclick="closeModal('checkoutModal')">إلغاء</button>
        </div>
    </div>

    <!-- مودال طلباتي -->
    <div class="modal-overlay" id="ordersModal">
        <div class="modal">
            <h3>📦 طلباتي السابقة</h3>
            <div id="ordersList"></div>
            <button class="cancel-btn" onclick="closeModal('ordersModal')">إغلاق</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <script src="script.js"></script>
</body>
</html>
