<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>متجر ليون | LION STORE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <!-- الهيدر العلوي -->
    <header class="main-header">
        <div class="logo-area">
            <div class="logo-circle">
                <img id="storeLogo" src="https://placehold.co/200x200?text=LION" alt="شعار المتجر">
            </div>
            <div class="store-title">
                <h1>متجر ليون</h1>
                <span>LION STORE</span>
            </div>
        </div>
        <div class="header-actions">
            <button id="ordersHistoryBtn" class="history-btn">
                <i class="fas fa-clock"></i>
                <span>طلباتي</span>
            </button>
            <button id="cartToggleBtn" class="cart-btn">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartCount">0</span>
            </button>
        </div>
    </header>

    <!-- سلة التسوق المنبثقة -->
    <div id="cartPanel" class="cart-panel hidden">
        <div class="cart-header">
            <h3>🛒 سلة المشتريات</h3>
            <button id="closeCartBtn" class="close-cart"><i class="fas fa-times"></i></button>
        </div>
        <div id="cartItemsList" class="cart-items-list"></div>
        <div class="cart-coupon">
            <input type="text" id="couponCode" placeholder="🎟️ كود الخصم">
            <button id="applyCouponBtn">تطبيق</button>
        </div>
        <div class="cart-summary">
            <p>المجموع: <span id="cartTotal">0.00</span> د.ع</p>
            <p>الخصم: -<span id="cartDiscount">0.00</span> د.ع</p>
            <p class="grand-total">الإجمالي: <span id="cartGrandTotal">0.00</span> د.ع</p>
        </div>
        <button id="checkoutBtn" class="checkout-btn">إتمام الطلب 📝</button>
    </div>

    <!-- سلايدر الصور -->
    <div class="slider-container">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper" id="sliderWrapper"></div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>

    <!-- حاوية الأقسام والمنتجات -->
    <div class="container">
        <div id="sectionsContainer"></div>
    </div>

    <!-- مودال تفاصيل المنتج -->
    <div id="productModal" class="modal">
        <div class="modal-content product-detail-modal">
            <span class="close-modal">&times;</span>
            <div id="productDetailContent"></div>
            <button id="modalAddToCart" class="add-to-cart-modal">➕ أضف للسلة</button>
        </div>
    </div>

    <!-- مودال بيانات العميل المتقدم -->
    <div id="customerModal" class="modal">
        <div class="modal-content" style="max-width:500px">
            <span class="close-modal">&times;</span>
            <h2>📋 معلومات الطلب</h2>
            <form id="customerForm">
                <input type="text" id="custName" placeholder="الاسم الكامل" required>
                
                <input type="tel" id="custPhone" placeholder="رقم الهاتف" required>
                <small style="color:#ff6a00; display:block; margin-top:-8px; margin-bottom:10px">سيتم إرسال رمز التحقق إلى هذا الرقم</small>
                
                <!-- المحافظة -->
                <select id="custGovernorate" required>
                    <option value="">-- اختر المحافظة --</option>
                    <option value="بغداد">بغداد</option>
                    <option value="النجف">النجف</option>
                    <option value="البصرة">البصرة</option>
                    <option value="اربيل">اربيل</option>
                    <option value="دهوك">دهوك</option>
                    <option value="السليمانية">السليمانية</option>
                    <option value="كركوك">كركوك</option>
                    <option value="نينوى">نينوى (الموصل)</option>
                    <option value="بابل">بابل</option>
                    <option value="كربلاء">كربلاء</option>
                    <option value="واسط">واسط</option>
                    <option value="ذي قار">ذي قار</option>
                    <option value="ميسان">ميسان</option>
                    <option value="المثنى">المثنى</option>
                    <option value="القادسية">القادسية</option>
                    <option value="ديالى">ديالى</option>
                    <option value="صلاح الدين">صلاح الدين</option>
                    <option value="الانبار">الأنبار</option>
                </select>
                
                <!-- المنطقة -->
                <select id="custDistrict" disabled required>
                    <option value="">-- اختر المنطقة أولاً --</option>
                </select>
                
                <input type="text" id="custNearestPoint" placeholder="أقرب نقطة دالة (مثل: مجمع النور، جامع الكبير)">
                
                <select id="custPaymentMethod" required>
                    <option value="">-- اختر طريقة الدفع --</option>
                    <option value="الدفع عند الاستلام">💵 الدفع عند الاستلام</option>
                    <option value="بطاقة ائتمان">💳 بطاقة ائتمان</option>
                    <option value="تحويل بنكي">🏦 تحويل بنكي</option>
                </select>
                
                <button type="submit" id="submitOrderBtn">📱 تأكيد الطلب وإرسال رمز التحقق</button>
            </form>
            
            <!-- نموذج التحقق من الرقم -->
            <div id="verifySection" style="display:none; margin-top:20px; border-top:1px solid #eee; padding-top:15px">
                <h4>🔐 تأكيد رقم الهاتف</h4>
                <p id="verifyMessage" style="font-size:12px; color:#666"></p>
                <input type="text" id="verifyCode" placeholder="أدخل رمز التحقق" style="text-align:center">
                <button id="confirmVerifyBtn" style="margin-top:10px; background:#25d366">✅ تأكيد وإرسال الطلب</button>
            </div>
        </div>
    </div>

    <!-- مودال الفاتورة -->
    <div id="invoiceModal" class="modal">
        <div class="modal-content invoice-modal">
            <span class="close-modal close-invoice">&times;</span>
            <h2>🧾 فاتورة الطلب</h2>
            <div id="invoiceDetails"></div>
            <button id="sendWhatsAppBtn" class="whatsapp-send-btn">📲 إرسال عبر واتساب</button>
        </div>
    </div>

    <!-- مودال الطلبات السابقة -->
    <div id="ordersModal" class="modal">
        <div class="modal-content orders-modal">
            <span class="close-modal close-orders">&times;</span>
            <h2>📦 طلباتي السابقة</h2>
            <div id="userOrdersList"></div>
        </div>
    </div>

    <!-- منطقة الإشعارات -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
