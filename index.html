<!-- index.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>متجر ليون | LION STORE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="background-overlay"></div>

    <!-- الهيدر العلوي مع الشعار والبحث والسلة -->
    <header class="main-header">
        <div class="header-right">
            <div class="logo-area">
                <div class="logo-circle">
                    <img id="storeLogo" src="https://placehold.co/200x200?text=LION" alt="شعار المتجر">
                </div>
                <div class="store-title">
                    <h1>متجر ليون</h1>
                    <span>LION STORE</span>
                </div>
            </div>
        </div>

        <div class="header-center">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
            </div>
        </div>

        <div class="header-left">
            <div class="user-profile" id="userProfileBtn">
                <i class="fas fa-user-circle"></i>
                <span>حسابي</span>
                <div class="user-dropdown" id="userDropdown">
                    <a href="#" id="myOrdersBtn"><i class="fas fa-box"></i> طلباتي</a>
                    <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل خروج</a>
                </div>
            </div>
            <div class="cart-icon-wrapper">
                <button id="cartToggleBtn" class="cart-icon-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cartCount">0</span>
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- سلة التسوق المنبثقة -->
        <div id="cartPanel" class="cart-panel hidden">
            <div class="cart-header">
                <h3>🛒 سلة المشتريات</h3>
                <button id="closeCartBtn" class="close-cart"><i class="fas fa-times"></i></button>
            </div>
            <div id="cartItemsList" class="cart-items-list"></div>
            <div class="cart-coupon">
                <input type="text" id="couponCode" placeholder="🎟️ أدخل كود الخصم">
                <button id="applyCouponBtn">تطبيق</button>
            </div>
            <div class="cart-summary">
                <p>المجموع: <span id="cartTotal">0.00</span> د.ع</p>
                <p>الخصم: -<span id="cartDiscount">0.00</span> د.ع</p>
                <p class="grand-total">الإجمالي: <span id="cartGrandTotal">0.00</span> د.ع</p>
            </div>
            <button id="checkoutBtn" class="checkout-btn">إتمام الطلب 📝</button>
        </div>

        <!-- فلترة المنتجات -->
        <div class="filters-bar">
            <button class="filter-btn active" data-category="all">الكل</button>
            <button class="filter-btn" data-category="electronics">إلكترونيات</button>
            <button class="filter-btn" data-category="clothing">ملابس</button>
            <button class="filter-btn" data-category="accessories">إكسسوارات</button>
        </div>

        <!-- شبكة المنتجات -->
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- مودال بيانات العميل -->
    <div id="customerModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>📋 معلومات الطلب</h2>
            <form id="customerForm">
                <input type="text" id="custName" placeholder="الاسم الكامل" required>
                <input type="tel" id="custPhone" placeholder="رقم الهاتف" required>
                <input type="text" id="custAddress" placeholder="العنوان بالتفصيل" required>
                <button type="submit">تأكيد الطلب وإرسال للواتساب 💬</button>
            </form>
        </div>
    </div>

    <!-- مودال الفاتورة -->
    <div id="invoiceModal" class="modal">
        <div class="modal-content invoice-modal">
            <span class="close-modal close-invoice">&times;</span>
            <h2>🧾 فاتورة الطلب</h2>
            <div id="invoiceDetails"></div>
            <button id="sendWhatsAppBtn" class="whatsapp-send-btn">📲 إرسال عبر واتساب</button>
        </div>
    </div>

    <!-- مودال طلباتي -->
    <div id="ordersModal" class="modal">
        <div class="modal-content orders-modal">
            <span class="close-modal close-orders">&times;</span>
            <h2>📦 طلباتي السابقة</h2>
            <div id="userOrdersList"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
